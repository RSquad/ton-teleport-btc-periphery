env:
  GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
  enabled: true
  extraPaths: []
  labels: {}
  path: /dashboard/
  pathType: ImplementationSpecific
persistence:
  enabled: true
  size: 1Gi
rbac:
  namespaced: true
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        isDefault: false