backend:
  extraContainers: null
  replicas: 0
chunksCache:
  replicas: 0
deploymentMode: SingleBinary
enterpriseGateway:
  replicas: 0
gateway:
  replicas: 0
rbac:
  namespaced: true
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
  schemaConfig:
    configs:
      - from: '2024-04-01'
        index:
          period: 24h
          prefix: loki_index_
        object_store: s3
        schema: v13
        store: tsdb
lokiCanary:
  enabled: false
minio:
  enabled: true
read:
  replicas: 0
singleBinary:
  persistence:
    size: 2Gi
  replicas: 1
test:
  enabled: false
write:
  replicas: 0
bloomCompactor:
  replicas: 0