replicaCount: 1

image:
  repository: registry.digitalocean.com/rsquad-prod/indexer-dev
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: app.local
      paths:
        - /

envs:
  - name: ENV_VAR1
    value: "value1"
  - name: ENV_VAR2
    value: "value2"

