apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    app: {{ include "app.name" . }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }} # Default to 1 replica if not specified
  selector:
    matchLabels:
      app: {{ include "app.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "app.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default 'latest' }}" # Default to 'latest'
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }} # Default to 'IfNotPresent'
          ports:
            - containerPort: {{ .Values.container.port | default 3000 }} # Default to port 3000
          env:
            {{- if .Values.BaseEnvs }}
              {{- range .Values.BaseEnvs }}
            - name: {{ .name }}
              value: "{{ .value }}"
              {{- end }}
            {{- end }}
            {{- if .Values.envs }}
              {{- range .Values.envs }}
            - name: {{ .name }}
              value: "{{ .value }}"
              {{- end }}
            {{- end }}
          {{- if or .Values.configMap .Values.secret }}
          envFrom:
            {{- if .Values.configMap }}
            - configMapRef:
                name: {{ include "app.fullname" . }}-config
            {{- end }}
            {{- if .Values.secret }}
            - secretRef:
                name: {{ include "app.fullname" . }}-secret
            {{- end }}
          {{- end }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}