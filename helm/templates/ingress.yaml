{{- if and .Values.ingress .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
    {{- if index .Values.ingress "letsencrypt-issuer" }}
    cert-manager.io/cluster-issuer: "{{ index .Values.ingress "letsencrypt-issuer" }}"
    {{- end }}
spec:
  ingressClassName: "nginx"
  {{- if index .Values.ingress "letsencrypt-issuer" }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - "{{ .host }}"
        {{- end }}
      secretName: "{{ (index .Values.ingress.hosts 0).host }}-tls"
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: "{{ .host }}"
      http:
        paths:
          {{- range .paths }}
          - path: "{{ . }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ include "app.fullname" $ }}"
                {{- if and $.Values.service $.Values.service.port }}
                port:
                  number: {{ $.Values.service.port }}
                {{- else }}
                port:
                  number: 80 # Default to 80 if not specified
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
