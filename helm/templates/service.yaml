{{- if .Values.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    app: {{ include "app.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}  # External port (e.g., 80)
      targetPort: {{ .Values.service.targetPort }}  # Container port (e.g., 3000)
  selector:
    app: {{ include "app.name" . }}
{{- end }}