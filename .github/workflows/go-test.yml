name: Go CI/CD

on:
  push:
    branches: [ master, develop, sandbox ]
  pull_request:
    branches: [ master, develop, sandbox ]

env:
  GO_VERSION: "1.21"
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint-and-verify:
    name: Lint & Verify
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    
    - name: Verify Go modules
      run: |
        go mod verify
        go mod tidy -v
        git diff --exit-code go.mod go.sum || (echo "Go modules are not tidy" && exit 1)
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: v1.55.2
        args: --timeout=10m --config=.golangci.yml
        skip-cache: true
    
    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-verify
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum
    
    - name: Install dependencies
      run: |
        go mod download
    
    - name: Run unit tests
      run: |
        go test ./... -v -race -coverprofile=coverage.out -covermode=atomic -short 2>&1 | tee test_output.txt
    
    - name: Generate coverage report
      run: |
        echo "=== Test Coverage Summary ==="
        go tool cover -func=coverage.out | tail -1
        echo "============================"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results
        path: |
          test_output.txt
          coverage.out

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Run gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt=json -out=gosec.json ./... 2>/dev/null || true
        gosec ./...
    
    - name: Run dependency check
      run: |
        go install github.com/google/osv-scanner/cmd/osv-scanner@latest
        osv-scanner -r .
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          gosec.json
        retention-days: 30

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint-and-verify, unit-tests, security-scan]
    if: always()
    
    steps:
    - name: Check workflow status
      run: |
        echo "Workflow completed!"
        echo "Summary of jobs:"
        echo "- Lint & Verify: ${{ needs.lint-and-verify.result }}"
        echo "- Unit Tests: ${{ needs.unit-tests.result }}"
        echo "- Security Scan: ${{ needs.security-scan.result }}"
        
        if [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then
          echo "❌ Unit tests failed!"
          exit 1
        fi