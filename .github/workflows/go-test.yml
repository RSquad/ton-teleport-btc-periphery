name: Go Tests

on:
  workflow_call:
    inputs:
      APPS:
        description: 'JSON array of app names to test'
        required: true
        type: string

env:
  GO_VERSION: "1.21"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(inputs.APPS) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: |
          ${{ matrix.app }}/go.sum
          lib/go.sum

    - name: Generate Entities
      working-directory: ${{ matrix.app }}
      run: |
        go generate
    
    - name: Verify Go modules for ${{ matrix.app }}
      working-directory: ${{ matrix.app }}
      run: |
        go mod verify
        go mod tidy -v
        git diff --exit-code go.mod go.sum || (echo "Go modules are not tidy" && exit 1)
    
    - name: Run golangci-lint for ${{ matrix.app }}
      uses: golangci/golangci-lint-action@v3
      with:
        version: v1.55.2
        working-directory: ${{ matrix.app }}
        args: --timeout=10m
        skip-cache: true
    
    - name: Run staticcheck for ${{ matrix.app }}
      working-directory: ${{ matrix.app }}
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...
    
    - name: Install dependencies for ${{ matrix.app }}
      working-directory: ${{ matrix.app }}
      run: |
        go mod download
    
    - name: Run unit tests for ${{ matrix.app }}
      working-directory: ${{ matrix.app }}
      run: |
        go test ./... -v -race -coverprofile=coverage.out -covermode=atomic -short 2>&1 | tee test_output.txt
    
    - name: Generate coverage report for ${{ matrix.app }}
      working-directory: ${{ matrix.app }}
      run: |
        echo "=== Test Coverage Summary for ${{ matrix.app }} ==="
        go tool cover -func=coverage.out | tail -1
        echo "============================"
    
    - name: Upload coverage to Codecov for ${{ matrix.app }}
      uses: codecov/codecov-action@v4
      with:
        file: ./${{ matrix.app }}/coverage.out
        flags: ${{ matrix.app }}
        name: codecov-${{ matrix.app }}
    
    - name: Upload test results for ${{ matrix.app }}
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.app }}-test-results
        path: |
          ${{ matrix.app }}/test_output.txt
          ${{ matrix.app }}/coverage.out

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        app: ${{ fromJson(inputs.APPS) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Run gosec for ${{ matrix.app }}
      working-directory: ${{ matrix.app }}
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt=json -out=gosec.json ./... 2>/dev/null || true
        gosec ./...
    
    - name: Run dependency check for ${{ matrix.app }}
      working-directory: ${{ matrix.app }}
      run: |
        go install github.com/google/osv-scanner/cmd/osv-scanner@latest
        osv-scanner -r .
    
    - name: Upload security reports for ${{ matrix.app }}
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.app }}-security-reports
        path: |
          ${{ matrix.app }}/gosec.json
        retention-days: 30
