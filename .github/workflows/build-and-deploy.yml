name: Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      stage:
        required: true
        type: string
      app_namespace:
        required: true
        type: string
      kube_config_secret:
        required: true
        type: string
      DOCKER_REGISTRY_URL:
        required: true
        type: string
      DOCKER_REGISTRY_USERNAME:
        required: true
        type: string
      DOCKER_REGISTRY_PASSWORD:
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: self-hosted
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          echo "APP_NAME=${{ inputs.app_name }}" >> $GITHUB_ENV
          echo "STAGE=${{ inputs.stage }}" >> $GITHUB_ENV
          echo "APP_NAMESPACE=${{ inputs.app_namespace }}" >> $GITHUB_ENV

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.DOCKER_REGISTRY_URL }}
          username: ${{ secrets[inputs.DOCKER_REGISTRY_USERNAME] }}
          password: ${{ secrets[inputs.DOCKER_REGISTRY_PASSWORD] }}

      - name: Setup Kubernetes Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl jq
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configure Kubeconfig
        shell: bash
        run: |
          # Write the secret to a file
          echo "${{ secrets[inputs.kube_config_secret] }}" > $(pwd)/kubeconfig.yaml

          # Make that file the default for kubectl in subsequent steps
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

          # Discover the single context in this kubeconfig (if exactly one)
          CONTEXT_COUNT=$(kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config get-contexts -o name | wc -l)
          if [ "$CONTEXT_COUNT" -eq 1 ]; then
            CONTEXT_NAME=$(kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config get-contexts -o name)
            echo "Found a single context: $CONTEXT_NAME"
            # Set it as the current-context in the file
            kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config use-context "$CONTEXT_NAME"
          else
            echo "ERROR: Found $CONTEXT_COUNT contexts; cannot pick automatically."
            exit 1
          fi

      - name: Debug Kubeconfig
        shell: bash
        run: |
          # Let's verify that the file has a current-context
          kubectl config get-contexts
          kubectl config current-context
          kubectl cluster-info

      - name: Fetch Environment Configs
        shell: bash
        run: |
          # Get configmap and store as JSON file
          kubectl get configmap envs-config -n ${{ inputs.app_namespace }} -o json > $(pwd)/config.json
          # Process environment variables
          jq -r '.data | to_entries[] | "\(.key)=\(.value | @sh)"' $(pwd)/config.json >> $GITHUB_ENV

      - name: Build and Deploy Apps
        shell: bash
        env:
          DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          IMAGE_PULL_SECRET_NAME: "github-registry-secret"
        run: |
          set -euo pipefail  # Enable strict error checking

          # Validate required fields
          if [[ -z "$APP_NAME" || -z "$APP_NAMESPACE" ]]; then
            echo "❌ Missing required fields"
            exit 1
          fi

          # Generate image tags
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_NAME="$DOCKER_REGISTRY_URL/$APP_NAME-$STAGE"

          echo "----------------------------------------"
          echo "🚀 Building and deploying $APP_NAME"
          echo "📦 Image: $IMAGE_NAME:$SHORT_SHA"
          echo "📁 Namespace: $APP_NAMESPACE"
          echo "----------------------------------------"

          # Build Docker image
          docker build \
            -f $APP_NAME/Dockerfile \
            --platform linux/amd64 \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$SHORT_SHA \
            .

          # Push Docker image
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHORT_SHA

          # Base Helm command
          HELM_CMD=(
            helm upgrade --install "$APP_NAME-$STAGE"
            "./helm/"
            --namespace "$APP_NAMESPACE"
            --create-namespace
            --set image.repository="$IMAGE_NAME"
            --set image.tag="$SHORT_SHA"
            --atomic
            --timeout 5m
            -f "$APP_NAME/$APP_NAME-$STAGE".yml
          )

          # Add registry credentials if available
          if [[ -n "$DOCKER_REGISTRY_URL" && -n "$DOCKER_REGISTRY_USERNAME" && -n "$DOCKER_REGISTRY_PASSWORD" ]]; then
            HELM_CMD+=(
              --set imagePullSecret.name="$IMAGE_PULL_SECRET_NAME"
              --set imagePullSecret.registry="$DOCKER_REGISTRY_URL"
              --set imagePullSecret.username="$DOCKER_REGISTRY_USERNAME"
              --set imagePullSecret.password="$DOCKER_REGISTRY_PASSWORD"
            )
          fi

          # Execute Helm command
          echo "🏃 Running: ${HELM_CMD[*]}"
          "${HELM_CMD[@]}"

          echo "✅ Successfully deployed $APP_NAME"
