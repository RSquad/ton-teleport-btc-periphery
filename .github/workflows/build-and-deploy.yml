name: Build and Deploy

on:
  workflow_call:
    inputs:
      APP_NAME:
        description: 'Name of the application'
        required: true
        type: string
      STAGE:
        description: 'Deployment stage (e.g., develop, production)'
        required: true
        type: string
      APP_NAMESPACE:
        description: 'Kubernetes namespace for the application'
        required: true
        type: string

jobs:
  build_and_deploy:
    runs-on: self-hosted
    environment: ${{ inputs.STAGE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment variables
        run: |
          echo "APP_NAME=${{ inputs.APP_NAME }}" >> $GITHUB_ENV
          echo "STAGE=${{ inputs.STAGE }}" >> $GITHUB_ENV
          echo "APP_NAMESPACE=${{ inputs.APP_NAMESPACE }}" >> $GITHUB_ENV

      - name: Setup Kubernetes Tools and Helm
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl jq
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configure Kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > "$(pwd)/kubeconfig.yaml"
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
          CONTEXT_COUNT=$(kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config get-contexts -o name | wc -l)
          if [ "$CONTEXT_COUNT" -eq 1 ]; then
            CONTEXT_NAME=$(kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config get-contexts -o name)
            kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config use-context "$CONTEXT_NAME"
          else
            echo "ERROR: Found $CONTEXT_COUNT contexts; cannot pick automatically."
            exit 1
          fi

      - name: Fetch Environment Configs from ConfigMap
        shell: bash
        run: |
          kubectl get configmap envs-config -n system -o json > config.json
          jq -r '.data | to_entries[] | select(.key | startswith("COMMON_")) | "\(.key)=\(.value)"' config.json >> $GITHUB_ENV
          echo "CommonEnvs:" > env-values.yaml
          jq -r '.data | to_entries[] | select(.key | startswith("COMMON_")) | "  - name: \(.key)\n    value: \"\(.value)\""' config.json >> env-values.yaml
          rm config.json

      - name: Fetch App-Specific Secrets from Kubernetes
        shell: bash
        run: |
          SECRET_NAME="${{ inputs.APP_NAME }}-secrets"
          if kubectl get secret "$SECRET_NAME" -n "${{ inputs.APP_NAMESPACE }}" &>/dev/null; then
            echo "Found secret: $SECRET_NAME"
            kubectl get secret "$SECRET_NAME" -n "${{ inputs.APP_NAMESPACE }}" -o json > secrets.json
            echo "SecretEnvs:" > secrets-values.yaml
            jq -r '.data
              | to_entries[]
              | "  - name: \(.key)\n    valueFrom:\n      secretKeyRef:\n        name: \"'$SECRET_NAME'\"\n        key: \(.key)"' secrets.json >> secrets-values.yaml
            rm secrets.json
          else
            echo "No secret found with name: $SECRET_NAME. Skipping secret injection."
            # Create an empty file so Helm won't fail
            echo "SecretEnvs: []" > secrets-values.yaml
          fi

      - name: Fetch Docker Registry Credentials from Kubernetes Secret
        shell: bash
        run: |
          dockerConfig=$(kubectl get secret docker-registry-creds -n $APP_NAMESPACE -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d)
          DOCKER_REGISTRY_URL=$(echo "$dockerConfig" | jq -r '.auths | to_entries[0].key')
          DOCKER_REGISTRY_USERNAME=$(echo "$dockerConfig" | jq -r '.auths | to_entries[0].value.username')
          DOCKER_REGISTRY_PASSWORD=$(echo "$dockerConfig" | jq -r '.auths | to_entries[0].value.password')
          echo "::add-mask::$DOCKER_REGISTRY_URL"
          echo "::add-mask::$DOCKER_REGISTRY_USERNAME"
          echo "::add-mask::$DOCKER_REGISTRY_PASSWORD"
          echo "DOCKER_REGISTRY_URL=$DOCKER_REGISTRY_URL" >> $GITHUB_ENV
          echo "DOCKER_REGISTRY_USERNAME=$DOCKER_REGISTRY_USERNAME" >> $GITHUB_ENV
          echo "DOCKER_REGISTRY_PASSWORD=$DOCKER_REGISTRY_PASSWORD" >> $GITHUB_ENV

      - name: Docker Login
        run: |
          docker login "$DOCKER_REGISTRY_URL" \
            --username "$DOCKER_REGISTRY_USERNAME" \
            --password "$DOCKER_REGISTRY_PASSWORD"

      - name: Build and Push Docker Image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_NAME="$DOCKER_REGISTRY_URL/${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"
          docker build \
            -f $APP_NAME/Dockerfile \
            --platform linux/amd64 \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$SHORT_SHA \
            .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHORT_SHA

      - name: Deploy Helm Release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_NAME="$DOCKER_REGISTRY_URL/${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"

          HELM_CMD=(
            helm upgrade --install "${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"
            "./helm/"
            --namespace "${{ inputs.APP_NAMESPACE }}"
            --create-namespace
            --set image.repository="$IMAGE_NAME"
            --set image.tag="$SHORT_SHA"
            --set app.name="${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"
            --timeout 5m
            -f env-values.yaml
            -f secrets-values.yaml
          )

          APP_VARS_FILE="${{ inputs.APP_NAME }}/${{ inputs.APP_NAME }}-${{ inputs.STAGE }}.yml"
          if [[ -s "$APP_VARS_FILE" ]]; then
            HELM_CMD+=(-f "$APP_VARS_FILE")
          fi

          "${HELM_CMD[@]}"