name: Build and Deploy

on:
  workflow_call:
    inputs:
      APP_NAME:
        description: 'Name of the application'
        required: true
        type: string
      STAGE:
        description: 'Deployment stage (e.g., develop, production)'
        required: true
        type: string
      APP_NAMESPACE:
        description: 'Kubernetes namespace for the application'
        required: true
        type: string
      DOCKER_REGISTRY_URL:
        description: 'URL of the Docker registry'
        required: true
        type: string
    secrets:
      DOCKER_REGISTRY_USERNAME:
        description: 'Username for Docker registry authentication'
        required: true
      DOCKER_REGISTRY_PASSWORD:
        description: 'Password for Docker registry authentication'
        required: true
      KUBE_CONFIG:
        description: 'Kubeconfig file content for Kubernetes cluster access'
        required: true

jobs:
  build:
    runs-on: self-hosted
    name: Build ${{ inputs.APP_NAME }} - ${{ inputs.STAGE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          echo "APP_NAME=${{ inputs.APP_NAME }}" >> $GITHUB_ENV
          echo "STAGE=${{ inputs.STAGE }}" >> $GITHUB_ENV
          echo "APP_NAMESPACE=${{ inputs.APP_NAMESPACE }}" >> $GITHUB_ENV

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_NAME="${{ inputs.DOCKER_REGISTRY_URL }}/${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"
          echo "Building image: $IMAGE_NAME:$SHORT_SHA"

          docker build \
            -f $APP_NAME/Dockerfile \
            --platform linux/amd64 \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$SHORT_SHA \
            .

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHORT_SHA

  deploy:
    runs-on: self-hosted
    name: Deploy ${{ inputs.APP_NAME }} - ${{ inputs.STAGE }}
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Kubernetes Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl jq
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configure Kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > $(pwd)/kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

          CONTEXT_COUNT=$(kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config get-contexts -o name | wc -l)
          if [ "$CONTEXT_COUNT" -eq 1 ]; then
            CONTEXT_NAME=$(kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config get-contexts -o name)
            kubectl --kubeconfig=$(pwd)/kubeconfig.yaml config use-context "$CONTEXT_NAME"
          else
            echo "ERROR: Found $CONTEXT_COUNT contexts; cannot pick automatically."
            exit 1
          fi

      - name: Fetch Environment Configs
        shell: bash
        run: |
          kubectl get configmap envs-config -n develop -o json > config.json
          jq -r '.data | to_entries[] | "\(.key)=\(.value | @sh)"' config.json >> $GITHUB_ENV

          echo "CommonEnvs:" >> env-values.yaml
          jq -r '.data | to_entries[] | "  - name: \(.key)\n    value: \"\(.value)\""' config.json >> env-values.yaml

      - name: Deploy Helm Release
        shell: bash
        env:
          DOCKER_REGISTRY_URL: ${{ inputs.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_NAME="${{ inputs.DOCKER_REGISTRY_URL }}/${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"
          IMAGE_PULL_SECRET_NAME="${{ inputs.APP_NAME }}-github-registry-secret"

          HELM_CMD=(
            helm upgrade --install "${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"
            "./helm/"
            --namespace "${{ inputs.APP_NAMESPACE }}"
            --create-namespace
            --set image.repository="$IMAGE_NAME"
            --set image.tag="$SHORT_SHA"
            --set app.name="${{ inputs.APP_NAME }}-${{ inputs.STAGE }}"
            --timeout 5m
            -f env-values.yaml
          )

          APP_VARS_FILE="${{ inputs.APP_NAME }}/${{ inputs.APP_NAME }}-${{ inputs.STAGE }}.yml"
          if [[ -s "$APP_VARS_FILE" ]]; then
            HELM_CMD+=(-f "$APP_VARS_FILE")
          fi

          if [[ -n "$DOCKER_REGISTRY_URL" && -n "$DOCKER_REGISTRY_USERNAME" && -n "$DOCKER_REGISTRY_PASSWORD" ]]; then
            HELM_CMD+=(
              --set imagePullSecret.name="$IMAGE_PULL_SECRET_NAME"
              --set imagePullSecret.registry="$DOCKER_REGISTRY_URL"
              --set imagePullSecret.username="$DOCKER_REGISTRY_USERNAME"
              --set imagePullSecret.password="$DOCKER_REGISTRY_PASSWORD"
            )
          fi

          "${HELM_CMD[@]}"