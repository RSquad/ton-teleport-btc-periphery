name: Build PR

on:
  pull_request:
    branches: [master, develop, sandbox]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write

jobs:
  build-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Build all Docker images
        run: |
          for app in indexer relayer oracle; do
            echo "⏳ Building $app …"
            docker build --platform linux/amd64 \
                         -f "${app}/Dockerfile" \
                         -t "pr-check/${app}:${GITHUB_SHA}" .
          done
          echo "✅  All images built successfully"
