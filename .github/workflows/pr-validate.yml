name: PR Build check

on:
  pull_request:
    branches: [master, develop, sandbox]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Verify Docker builds
        run: |
          echo "Testing indexer Docker build..."
          docker build -f indexer/Dockerfile -t test-indexer .
          echo "Testing relayer Docker build..."
          docker build -f relayer/Dockerfile -t test-relayer .
          echo "Testing db-backup Docker build..."
          docker build -f db-backup/Dockerfile -t test-db-backup .
          echo "Testing oracle Docker build..."
          docker build -f oracle/Dockerfile -t test-oracle .

  complete:
    name: PR check complete
    needs: [build-and-test, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Testing succeeded – ready to merge."

  notify:
    name: Telegram notification
    needs: [build-and-test, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send message to Telegram
        uses: Ofceab-Studio/telegram-action@1.0.1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to:    ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: 1321
          format: markdown
          message: |
            ${{ needs.build-and-test.result == 'success' && '✅ *Testing succeeded*' || '❌ *Testing failed*' }}
            *Repository:* `${{ github.repository }}`
            *PR:* [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})
            *Branch:* `${{ github.ref_name }}`
            *Build #:* `${{ github.run_number }}`
