name: PR Build check
on:
  pull_request:
    branches: [master, develop, sandbox]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read

jobs:
  build:
    name: build check for ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [indexer, relayer, oracle]
    steps:
      - uses: actions/checkout@v3
      - name: Build ${{ matrix.app }}
        run: |
          docker build --platform linux/amd64 \
                       -f "${{ matrix.app }}/Dockerfile" \
                       -t "pr-check/${{ matrix.app }}:${GITHUB_SHA}" .
          echo "✅  ${{ matrix.app }} built successfully"
  complete:
    name: PR check complete
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "All Docker images built successfully – ready to merge."