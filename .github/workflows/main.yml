name: CI/CD Pipeline

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/go-test.yml
    with:
      APPS: '["indexer", "relayer", "oracle", "db-backup", "metrics"]'

  develop:
    name: Build & Push - Develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: tests
    uses: ./.github/workflows/build-and-push.yml
    with:
      APPS: '["indexer", "relayer", "oracle", "db-backup", "metrics"]'
      STAGE: develop
      DOCKER_REGISTRY_URL: registry.digitalocean.com/rsquad-dev
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCR_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCR_PASSWORD }}

  sandbox:
    name: Build & Push - Sandbox
    if: github.event_name == 'push' && github.ref == 'refs/heads/sandbox'
    needs: tests
    uses: ./.github/workflows/build-and-push.yml
    with:
      APPS: '["indexer", "relayer", "db-backup", "metrics"]'
      STAGE: sandbox
      DOCKER_REGISTRY_URL: registry.digitalocean.com/rsquad-dev
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCR_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCR_PASSWORD }}

  master:
    name: Build & Push - Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: tests
    uses: ./.github/workflows/build-and-push.yml
    with:
      APPS: '["indexer", "relayer", "oracle", "db-backup", "metrics"]'
      STAGE: prod
      DOCKER_REGISTRY_URL: registry.digitalocean.com/rsquad-prod
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCR_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCR_PASSWORD }}
