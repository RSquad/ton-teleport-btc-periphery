name: Build and Deploy

on:
  push:
    branches:
      - develop
      - sandbox
    paths-ignore:
      - '**/*.md'

jobs:
  develop:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/build-and-push.yml
    with:
      APPS: '["indexer", "relayer", "oracle", "db-backup"]'
      STAGE: develop
      DOCKER_REGISTRY_URL: registry.digitalocean.com/rsquad-dev
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCR_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCR_PASSWORD }}
  sandbox:
    if: github.ref == 'refs/heads/sandbox'
    uses: ./.github/workflows/build-and-push.yml
    with:
      APPS: '["indexer", "relayer", "db-backup"]'
      STAGE: sandbox
      DOCKER_REGISTRY_URL: registry.digitalocean.com/rsquad-dev
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCR_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCR_PASSWORD }}