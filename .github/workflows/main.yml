name: Build and Deploy to K8s (via Helm)

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  # ==========================
  #       DEV / develop
  # ==========================
  build-and-deploy-develop:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: self-hosted
    name: Build and Deploy (develop)
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Setup Kubernetes Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl jq
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configure Kubecontext (develop)
        shell: bash
        run: |
          echo "${{ secrets.DEV_KUBE_CONFIG }}" > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
          kubectl config use-context "$(kubectl config get-contexts -o name)"

      - name: Fetch Environment Configs
        shell: bash
        run: |
          # Get combined environment configuration
          kubectl get configmap envs-config -n develop -o json > config.json
          
          # Extract apps configuration
          APPS_CONFIG=$(jq -r '.data.apps_config' config.json)
          echo "APPS_CONFIG=$APPS_CONFIG" >> $GITHUB_ENV
          
          # Set regular environment variables
          jq -r '.data | to_entries[] | select(.key != "apps_config") | "\(.key)=\(.value)"' config.json >> $GITHUB_ENV

      - name: Validate Configurations
        shell: bash
        run: |
          # Validate apps_config JSON
          if ! jq -e '. | length > 0' <<< "${{ env.APPS_CONFIG }}"; then
            echo "❌ Invalid or empty apps_config"
            exit 1
          fi

          # Validate required environment variables
          for var in DOCKER_REGISTRY_URL DEPLOY_NAMESPACE; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required variable: $var"
              exit 1
            fi
          done

      - name: Build and Deploy Apps
        strategy:
          matrix:
            config: ${{ fromJson(env.APPS_CONFIG) }}
        shell: bash
        run: |
          # Build parameters
          APP_NAME="${{ matrix.config.app }}"
          DEV_CONFIG="${{ matrix.config.dev }}"
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          IMAGE_NAME="$DOCKER_REGISTRY_URL/${APP_NAME}-dev"

          # Build and push Docker image
          docker build \
            -f $APP_NAME/Dockerfile \
            -t $IMAGE_NAME:$IMAGE_TAG \
            -t $IMAGE_NAME:latest \
            .

          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

          # Helm deployment
          helm upgrade --install $APP_NAME-dev \
            ./helm/$APP_NAME \
            --namespace $DEPLOY_NAMESPACE \
            --set image.repository=$IMAGE_NAME \
            --set image.tag=$IMAGE_TAG \
            --set ingress.host="${{ fromJson(DEV_CONFIG).dns_host }}" \
            --set environment=dev \
            --atomic \
            --timeout 5m

  # ==========================
  #       PROD / PRODUCTION
  # ==========================
