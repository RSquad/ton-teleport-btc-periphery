name: Deploy Apps

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App name (e.g., indexer, relayer)'
        required: true
        type: choice
        options:
          - indexer
          - relayer
      stage:
        description: 'Stage (e.g., dev, prod)'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          echo "APP=${{ github.event.inputs.app }}" >> $GITHUB_ENV
          echo "STAGE=${{ github.event.inputs.stage }}" >> $GITHUB_ENV

      - name: Run deploy script
        run: |
          chmod +x ./helm/deploy.sh
          ./helm/deploy.sh
