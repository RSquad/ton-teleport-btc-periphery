name: Build and Deploy to K8s (via Helm)

on:
  push:
    branches: ['**']    # Triggers on any branch push
    tags: ['v*']        # Triggers on tag pushes starting with 'v'

jobs:
  # ==========================
  #       DEV / Develop - Indexer
  # ==========================
  build-and-deploy-develop-indexer:
    if: startsWith(github.ref, 'refs/heads/')   # Runs only on branch pushes
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      app_name: indexer
      stage: develop
      app_namespace: develop
      DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}

  # ==========================
  #       DEV / Develop - Relayer
  # ==========================
  build-and-deploy-develop-relayer:
    if: startsWith(github.ref, 'refs/heads/')   # Runs only on branch pushes
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      app_name: relayer
      stage: develop
      app_namespace: develop
      DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}

  # ==========================
  #       PROD / Production - Indexer
  # ==========================
  build-and-deploy-prod-indexer:
    if: startsWith(github.ref, 'refs/tags/')    # Runs only on tag pushes
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      app_name: indexer
      stage: production
      app_namespace: production
      DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      KUBE_CONFIG: ${{ secrets.PROD_KUBE_CONFIG }}

  # ==========================
  #       PROD / Production - Relayer
  # ==========================
  build-and-deploy-prod-relayer:
    if: startsWith(github.ref, 'refs/tags/')    # Runs only on tag pushes
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      app_name: relayer
      stage: production
      app_namespace: production
      DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      KUBE_CONFIG: ${{ secrets.PROD_KUBE_CONFIG }}
