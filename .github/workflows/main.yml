name: Build and Deploy to K8s (via Helm)

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  # ==========================
  #       DEV / develop
  # ==========================
  build-and-deploy-develop:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: self-hosted
    name: Build and Deploy (develop)
    
    steps:
      - name: Check out repository (develop)
        uses: actions/checkout@v3

      - name: Docker Login (develop)
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Setup Kubernetes Tools (develop)
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl jq
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configure Kubeconfig (develop)
        shell: bash
        run: |
          # Write the secret to a file
          echo "${{ secrets.DEV_KUBE_CONFIG }}" > $(pwd)/kubeconfig-develop.yaml

          # Make that file the default for kubectl in subsequent steps
          echo "KUBECONFIG=$(pwd)/kubeconfig-develop.yaml" >> $GITHUB_ENV

          # Discover the single context in this kubeconfig (if exactly one)
          CONTEXT_COUNT=$(kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config get-contexts -o name | wc -l)
          if [ "$CONTEXT_COUNT" -eq 1 ]; then
            CONTEXT_NAME=$(kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config get-contexts -o name)
            echo "Found a single context: $CONTEXT_NAME"
            # Set it as the current-context in the file
            kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config use-context "$CONTEXT_NAME"
          else
            echo "ERROR: Found $CONTEXT_COUNT contexts; cannot pick automatically."
            exit 1
          fi
          
      - name: Debug Kubeconfig (develop)
        shell: bash
        run: |
          # Let's verify that the file has a current-context
          kubectl config get-contexts
          kubectl config current-context
          kubectl cluster-info
          
      - name: Fetch Environment Configs (develop)
        shell: bash
        run: |
          # Get configmap and store as JSON file
          kubectl get configmap envs-config -n develop -o json > $(pwd)/config.json
          # Process apps_config as raw JSON (remove sed escaping)
          APPS_CONFIG=$(jq -r '.data.apps_config' $(pwd)/config.json)
          # Add to GITHUB_ENV with proper formatting
          echo "APPS_CONFIG<<EOF" >> $GITHUB_ENV
          echo "$APPS_CONFIG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          # Process other environment variables
          jq -r '.data | to_entries[] | select(.key != "apps_config") | "\(.key)=\(.value | @sh)"' $(pwd)/config.json >> $GITHUB_ENV

      - name: Validate Configurations (develop)
        shell: bash
        run: |
          # Enhanced validation
          if ! echo "$APPS_CONFIG" | jq -e 'type == "array" and length > 0' >/dev/null; then
            echo "❌ Invalid apps_config - must be a non-empty array"
            exit 1
          fi

      - name: Build and Deploy Apps (develop)
        shell: bash
        env:
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          DEVELOP_NAMESPACE: ${{ env.DEVELOP_NAMESPACE }}
        run: |
          set -euo pipefail  # Enable strict error checking
          
          # Validate apps_config structure first
          if ! jq -e 'type == "array" and length > 0' <<< "$APPS_CONFIG"; then
            echo "❌ Invalid apps_config - must be a non-empty JSON array"
            exit 1
          fi
      
          # Process each application configuration
          echo "$APPS_CONFIG" | jq -c '.[]' | while read -r APP_CONFIG; do
            # Extract values with error handling
            APP_NAME=$(echo "$APP_CONFIG" | jq -r '.app')
            DEV_DNS=$(echo "$APP_CONFIG" | jq -r '.dev.dns_host')
            DEV_NAMESPACE=$(echo "$APP_CONFIG" | jq -r '.dev.namespace // ""')
      
            # Validate required fields
            if [[ -z "$APP_NAME" || -z "$DEV_DNS" ]]; then
              echo "❌ Missing required fields in app config: $APP_CONFIG"
              exit 1
            fi
      
            # Set default namespace if not specified
            : "${DEV_NAMESPACE:=$DEVELOP_NAMESPACE}"
      
            # Generate image tags
            SHORT_SHA="${GITHUB_SHA:0:7}"
            IMAGE_NAME="$DOCKER_REGISTRY_URL/$APP_NAME-dev"
      
            echo "----------------------------------------"
            echo "🚀 Building and deploying $APP_NAME"
            echo "📦 Image: $IMAGE_NAME:$SHORT_SHA"
            echo "🌐 Host: $DEV_DNS"
            echo "📁 Namespace: $DEV_NAMESPACE"
            echo "----------------------------------------"
      
            # Build Docker image
            docker buildx build \
              -f "$APP_NAME/Dockerfile" \
              --platform linux/amd64 \
              -t "$IMAGE_NAME:$SHORT_SHA" \
              -t "$IMAGE_NAME:latest" \
              --push \
              .
      
            # Helm deployment with atomic rollback
            helm upgrade --install "$APP_NAME-dev" \
              "./helm/$APP_NAME" \
              --namespace "$DEV_NAMESPACE" \
              --create-namespace \
              --set image.repository="$IMAGE_NAME" \
              --set image.tag="$SHORT_SHA" \
              --set ingress.host="$DEV_DNS" \
              --set environment=dev \
              --atomic \
              --timeout 5m \
              --wait
      
            echo "✅ Successfully deployed $APP_NAME"
          done
          
  # ==========================
  #       PROD / PRODUCTION
  # ==========================
  build-and-deploy-prod:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    name: Build and Deploy (production)
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

