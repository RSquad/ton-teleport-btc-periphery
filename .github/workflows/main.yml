name: Build and Deploy to K8s (via Helm)

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  # ==========================
  #       DEV / develop
  # ==========================
  build-and-deploy-develop:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: self-hosted
    name: Build and Deploy (develop)
    
    steps:
      - name: Check out repository (develop)
        uses: actions/checkout@v3

      - name: Docker Login (develop)
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Setup Kubernetes Tools (develop)
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl jq
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Configure Kubeconfig (develop)
        shell: bash
        run: |
          # Write the secret to a file
          echo "${{ secrets.DEV_KUBE_CONFIG }}" > $(pwd)/kubeconfig-develop.yaml

          # Make that file the default for kubectl in subsequent steps
          echo "KUBECONFIG=$(pwd)/kubeconfig-develop.yaml" >> $GITHUB_ENV

          # Discover the single context in this kubeconfig (if exactly one)
          CONTEXT_COUNT=$(kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config get-contexts -o name | wc -l)
          if [ "$CONTEXT_COUNT" -eq 1 ]; then
            CONTEXT_NAME=$(kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config get-contexts -o name)
            echo "Found a single context: $CONTEXT_NAME"
            # Set it as the current-context in the file
            kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config use-context "$CONTEXT_NAME"
          else
            echo "ERROR: Found $CONTEXT_COUNT contexts; cannot pick automatically."
            exit 1
          fi
          
      - name: Debug Kubeconfig (develop)
        shell: bash
        run: |
          # Let's verify that the file has a current-context
          kubectl config get-contexts
          kubectl config current-context
          kubectl cluster-info
          
      - name: Fetch Environment Configs (develop)
        shell: bash
        run: |
          kubectl get configmap envs-config -n develop -o json > $(pwd)/config.json
          APPS_CONFIG=$(jq -c -r '.data.apps_config' $(pwd)/config.json)
          echo "APPS_CONFIG=${APPS_CONFIG}" >> $GITHUB_ENV
          jq -r '.data | to_entries[] | select(.key != "apps_config") | "\(.key)=\(.value)"' $(pwd)/config.json >> $GITHUB_ENV

      - name: Debug Environment (develop)
        shell: bash
        run: |
          echo "--------------------------------------------------------------------------------"
          echo "Contents of \$GITHUB_ENV (for debugging):"
          echo "--------------------------------------------------------------------------------"
          cat "$GITHUB_ENV" || echo "No \$GITHUB_ENV file found."
          echo "--------------------------------------------------------------------------------"
          echo "APPS_CONFIG: ${{ env.APPS_CONFIG }}"
          echo "--------------------------------------------------------------------------------"

      - name: Validate Configurations (develop)
        shell: bash
        run: |
          if ! jq -e '. | length > 0' <<< "${{ env.APPS_CONFIG }}"; then
            echo "❌ Invalid or empty apps_config"
            exit 1
          fi

      - name: Build and Deploy Apps (develop)
        shell: bash
        run: |
          # "env.APPS_CONFIG" should already be set by a previous step,
          # for example via:  echo "APPS_CONFIG=$(jq -r '.data.apps_config' $(pwd)/config.json)" >> $GITHUB_ENV      
          # APPS_CONFIG is expected to be a JSON array. Example:
          # [
          #   {"app": "serviceA", "dev": {"dns_host": "serviceA.dev.example.com"}, ...},
          #   {"app": "serviceB", "dev": {"dns_host": "serviceB.dev.example.com"}, ...}
          # ]
          
          # Loop through each object in the JSON array
          for row in $(echo "${{ env.APPS_CONFIG }}" | jq -c '.[]'); do
            # Extract values from this item
            APP_NAME=$(echo "$row" | jq -r '.app')
            DEV_DNS=$(echo "$row" | jq -r '.dev.dns_host')
            
            # Construct image name & tags
            IMAGE_TAG="${GITHUB_SHA:0:7}" # 7-char short SHA
            IMAGE_NAME="$DOCKER_REGISTRY_URL/$APP_NAME-dev"
      
            echo "----------------------------------------"
            echo "🚀 Building and deploying $APP_NAME"
            echo "----------------------------------------"
      
            # Build Docker image
            docker build \
              -f $APP_NAME/Dockerfile \
              -t $IMAGE_NAME:$IMAGE_TAG \
              -t $IMAGE_NAME:latest \
              .
      
            # Push Docker images
            docker push $IMAGE_NAME:$IMAGE_TAG
            docker push $IMAGE_NAME:latest
      
            # Deploy with Helm
            helm upgrade --install "$APP_NAME-dev" \
              "./helm/$APP_NAME" \
              --namespace "$DEVELOP_NAMESPACE" \
              --set image.repository="$IMAGE_NAME" \
              --set image.tag="$IMAGE_TAG" \
              --set ingress.host="$DEV_DNS" \
              --set environment=dev \
              --atomic \
              --timeout 5m
          done

  # ==========================
  #       PROD / PRODUCTION
  # ==========================
  build-and-deploy-prod:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    name: Build and Deploy (production)
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

