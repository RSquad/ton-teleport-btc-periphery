name: Build and Deploy to K8s (via Helm)

on:
  push:
    branches:
      - '**'       # Any branch
    tags:
      - 'v*'       # Tags starting with v (e.g. v1.0.0)

jobs:
  # ==========================
  #       DEV / develop
  # ==========================
  build-and-deploy-develop:
    # Condition: run only if this is a push to a branch (not a tag)
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: self-hosted
    name: Build and Deploy (develop)

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Install kubectl (develop)
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Install Helm (develop)
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Set up Kubeconfig (develop)
        shell: bash
        run: |
          # Write the secret to a file
          echo "${{ secrets.DEV_KUBE_CONFIG }}" > $(pwd)/kubeconfig-develop.yaml

          # Make that file the default for kubectl in subsequent steps
          echo "KUBECONFIG=$(pwd)/kubeconfig-develop.yaml" >> $GITHUB_ENV

          # Discover the single context in this kubeconfig (if exactly one)
          CONTEXT_COUNT=$(kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config get-contexts -o name | wc -l)
          if [ "$CONTEXT_COUNT" -eq 1 ]; then
            CONTEXT_NAME=$(kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config get-contexts -o name)
            echo "Found a single context: $CONTEXT_NAME"
            # Set it as the current-context in the file
            kubectl --kubeconfig=$(pwd)/kubeconfig-develop.yaml config use-context "$CONTEXT_NAME"
          else
            echo "ERROR: Found $CONTEXT_COUNT contexts; cannot pick automatically."
            exit 1
          fi

      - name: Debug Kubeconfig (develop)
        shell: bash
        run: |
          # Now that the file has a current-context, let's verify
          kubectl config get-contexts
          kubectl config current-context
          kubectl cluster-info

      - name: Fetch ConfigMap (develop)
        shell: bash
        run: |
          kubectl get configmap envs-config -n develop -o json > $(pwd)/config.json

      - name: Install jq (develop)
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Debug Fetch ConfigMap (develop)
        shell: bash
        run: |
          # Fetch the config map to verify its contents
          echo "===== Debug: ENVs Configmap Dumped ====="
          jq -r '.data | to_entries[] | "\(.key)=\(.value)"' $(pwd)/config.json

      - name: Set Environment Variables from ConfigMap (develop)
        shell: bash
        run: |
          # For each "key=value" entry in the ConfigMap's .data section,
          # write it into the $GITHUB_ENV file as environment variables.
          jq -r '.data | to_entries[] | "\(.key)=\(.value)"' "$(pwd)/config.json" \
          | while IFS='=' read -r key value; do
              echo "$key=$value" >> "$GITHUB_ENV"
            done

      - name: Print Environment Variables (develop)
        shell: bash
        run: |
          echo "===== Debug: Environment Variables Collected ====="
          cat "$GITHUB_ENV"

      - name: Build and Push Docker Image (develop)
        shell: bash
        run: |
          IMAGE_NAME="${{ vars.DOCKER_REGISTRY_URL }}/indexer-dev"
          COMMIT_SHA="${{ github.sha }}"

          docker build \
            -f indexer/Dockerfile \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$COMMIT_SHA \
            .

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$COMMIT_SHA

      - name: Deploy with deploy.sh (develop)
        shell: bash
        env:
          DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          IMAGE_PULL_SECRET_NAME: "github-registry-secret" # Optional, defaults to "my-registry-secret" in deploy.sh
        run: |
          # Make sure deploy.sh is executable
          chmod +x helm/deploy.sh

          # Execute deploy.sh with parameters:
          # <image-path> <dns-host> <tag>
          ./helm/deploy.sh "${{ vars.DOCKER_REGISTRY_URL }}/indexer-dev" "indexer.rsquad.local" "latest"

  # ==========================
  #       PROD / PRODUCTION
  # ==========================
  build-and-deploy-prod:
    # Condition: run only if this is a push to a tag (refs/tags/...)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    name: Build and Deploy (production)

    steps:
      - name: Check out repository (production)
        uses: actions/checkout@v3

      - name: Docker Login (production)
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
