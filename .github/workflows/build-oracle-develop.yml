name: Build and Publish Oracle to develop

on:
  push:
    branches:
      - develop
    paths:
      - 'oracle/**'
      - 'frost/**'
      - 'lib/**'
      - '.github/workflows/build-oracle-develop.yml'

env:
  WORKSPACE: ${{ github.workspace }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: develop
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v1
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t registry.digitalocean.com/rsquad-dev/ton-teleport-btc-oracle:latest -f ${{ env.WORKSPACE }}/oracle/Dockerfile .
          docker push registry.digitalocean.com/rsquad-dev/ton-teleport-btc-oracle:latest