apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
- name: grafana-dashboards
  files:
  - advanced.json
  - burns.json
  - internal-keys.json
  - mints.json
  - operations.json
  - reinits.json
  - statistics.json
  - app-logs.json
  - contract-balances.json
  - alerts.json
  - system-info.json