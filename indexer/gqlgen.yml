schema:
  - ./schema.graphql

exec:
  filename: internal/gql/generated.go
  package: gql

resolver:
  layout: follow-schema
  dir: internal/gql
  package: gql
  filename_template: "{name}.resolvers.go"

call_argument_directives_with_null: true

autobind:
  - "github.com/rsquad/ton-teleport-btc-periphery/indexer/internal/ent/generated"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.IntID
  Node:
    model:
      - github.com/rsquad/ton-teleport-btc-periphery/indexer/internal/ent/generated.Noder
