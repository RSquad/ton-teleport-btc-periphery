replicaCount: 1

image:
  repository: 
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: app.local
      paths:
        - /indexer

envs:
  - name: INDEXER_DATABASE_URL
    value: "postgresql://7788999:123456@123321.ondigitalocean.com:25060/indexer?sslmode=require"

