deploymentType: StatefulSet
replicaCount: 50

storage:
  size: 50Mi
  path: /app/keystore/

SecretNames:
  pubkey: ORACLE_PUBKEY
  secret: ORACLE_SECRET

CustomInitScript: |
  echo "Pod hostname is: $HOSTNAME" >> /app/log
  ORDINAL=$(echo "${HOSTNAME##*-}")
  export ORDINAL="${ORDINAL}"
  OLD_PUBKEY="ORACLE_PUBKEY-$ORDINAL"
  if [ ! -z "${!OLD_PUBKEY}" ]; then
    export ORACLE_PUBKEY="${!OLD_PUBKEY}"
    echo "Set ORACLE_PUBKEY from $OLD_PUBKEY" >> /app/log
  else
    echo "WARNING: $OLD_PUBKEY not found or empty" >> /app/log
  fi
  OLD_SECRET="ORACLE_SECRET-$ORDINAL"
  if [ ! -z "${!OLD_SECRET}" ]; then
    export ORACLE_SECRET="${!OLD_SECRET}"
    echo "Set ORACLE_SECRET from $OLD_SECRET" >> /app/log
  else
    echo "WARNING: $OLD_SECRET not found or empty" >> /app/log
  fi
  echo "Starting main application..." >> /app/log
  exec /app/bin