deploymentType: StatefulSet
replicaCount: 50

storage:
  size: 50Mi
  path: /app/keystore/

SecretNames:
  pubkey: ORACLE_PUBKEY
  secret: ORACLE_SECRET

CustomInitScript: |
  echo "Pod hostname is: $HOSTNAME"

  ORDINAL=$(echo "${HOSTNAME##*-}")
  echo "Pod ordinal is: $ORDINAL"

  OLD_PUBKEY="ORACLE_PUBKEY-$ORDINAL"
  TMP_OLD_PUBKEY="$(printenv "$OLD_PUBKEY")"

  echo "Value in $OLD_PUBKEY: $TMP_OLD_PUBKEY"

  if [ -n "$TMP_OLD_PUBKEY" ]; then
    export ORACLE_PUBKEY="$TMP_OLD_PUBKEY"
    echo "Set ORACLE_PUBKEY from $OLD_PUBKEY"
    echo "New ORACLE_PUBKEY: $ORACLE_PUBKEY"
  else
    echo "WARNING: $OLD_PUBKEY not found or empty"
  fi

  OLD_SECRET="ORACLE_SECRET-$ORDINAL"
  TMP_OLD_SECRET="$(printenv "$OLD_SECRET")"

  echo "Value in $OLD_SECRET: $TMP_OLD_SECRET"

  if [ -n "$TMP_OLD_SECRET" ]; then
    export ORACLE_SECRET="$TMP_OLD_SECRET"
    echo "Set ORACLE_SECRET from $OLD_SECRET"
    echo "New ORACLE_SECRET: $ORACLE_SECRET"
  else
    echo "WARNING: $OLD_SECRET not found or empty"
  fi

  echo "Starting main application..."
  exec /app/bin
