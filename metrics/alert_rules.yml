# This is the rules file.
groups:
  - name: pegout.fee
    rules:
      - alert: PegoutFeeNotResetCritical
        # is_critical? = (last_pegout_block_height < confirmed_block_height) & (next_svb > 0)
        # 0 - OK, 1 - CRIT
        expr: alert_pegout_fee_not_reset == 1
        labels:
          severity: critical
        annotations:
          description: "Pegout transaction already has 5 confirmations but the fee has not been reset"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

  - name: pegout.signers
    rules:
      # 0 - greater or equal to 80% of max signers
      # 1 -  less than 80% of max signers
      # 2 - less than 70% of max signers
      - alert: PegoutSignersWarning
        expr: alert_pegout_signers == 1
        labels:
          severity: warning
        annotations:
          description: "Number of validators allowed to sign pegout is less than 80%"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

      - alert: PegoutSignersCritical
        expr: alert_pegout_signers == 2
        labels:
          severity: critical
        annotations:
          description: "Number of validators allowed to sign pegout is less than 70%"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"
  
  - name: pegout.restarts
    rules:
      # 0 - no restarts
      # 1 - 1 restart
      # 2 - 10 restarts
      - alert: PegoutRestartsWarning
        expr: alert_pegout_restarts == 1
        labels:
          severity: warning
        annotations:
          description: "The pegout signing was restarted 1 time"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

      - alert: PegoutRestartsCritical
        expr: alert_pegout_restarts == 2
        labels:
          severity: critical
        annotations:
          description: "The pegout signing was restarted 10 times"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

  - name: pegout.commitments
    rules:
      # 0 - commitments count is in range 90%-100%
      # 1 - commitments count is in range 80%-90%
      # 2 - commitments count is in range (threshold%)-80%
      # 3 - commitments count is less than threshold
      - alert: PegoutCommitmentsInfo
        expr: alert_pegout_commitments_count == 1
        labels:
          severity: info
        annotations:
          description: "The number of pegout commitments is less than 90%"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

      - alert: PegoutCommitmentsWarning
        expr: alert_pegout_commitments_count == 2
        labels:
          severity: warning
        annotations:
          description: "The number of pegout commitments is less than 80%"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

      - alert: PegoutCommitmentsCritical
        expr: alert_pegout_commitments_count == 3
        labels:
          severity: critical
        annotations:
          description: "The number of pegout commitments is less than threshold"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"
          threshold: "{{ $labels.threshold }}"

  - name: pegout.mempool
    rules:
      # 0 - pegout transaction is in mempool or block
      # 1 - pegout transaction not found in mempool for 10 minutes
      # 2 - pegout transaction not found in mempool for 40 minutes
      - alert: PegoutInMempoolWarning
        expr: alert_pegout_in_mempool == 1
        labels:
          severity: warning
        annotations:
          description: "pegout transaction not found in mempool for 10 minutes"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

      - alert: PegoutInMempoolCritical
        expr: alert_pegout_in_mempool == 2
        labels:
          severity: critical
        annotations:
          description: "pegout transaction not found in mempool for 40 minutes"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

  - name: pegout.signing
    rules:
      # 0 - pegout is signed or signing is in progress for less than 20 minutes
      # 1 - pegout is unsigned for 20 minutes or more
      - alert: PegoutSigningCritical
        expr: alert_pegout_unsigned == 1
        labels:
          severity: critical
        annotations:
          description: "pegout transaction was not signed within 20 minutes"
          pegout_txid: "{{ $labels.bitcoin_tx_id }}"
          pegout_addr: "{{ $labels.pegout_addr }}"

  - name: dkg.status
    rules:
      # 0 - DKG finished or null
      # 1 - DKG in progress
      # 2 - DKG part 1 finished
      # 3 - DKG part 2 finished
    - alert: DKGStatusFinished
      expr: dkg_status == 0
      labels:
        severity: info
      annotations:
        description: "DKG finished"

    - alert: DKGStatusInProgress
      expr: dkg_status == 1
      labels:
        severity: info
      annotations:
        description: "DKG started"

  - name: contract.balances
    rules:
      # 0 - contract balance is in range [2 ton - ]
      # 1 - contract balance is in range [0.5 ton - 2 ton]
      # 2 - contract balance is in range [0 - 0.5 ton]
    - alert: LowContractBalance
      expr: contract_balance{} < 2
      labels:
        severity: "{{ if lt $value 0.5 }}critical{{ else }}warning{{ end }}"
      annotations:
        description: '{{ $labels.name }} balance is {{ $value | printf "%.9f" }} ton'
        contract_name: "{{ $labels.name }}"
        contract_address: "{{ $labels.address }}"
        balance: '{{ $value | printf "%.9f" }}'

  - name: fees.health
    rules:
      # 0 - total_service_fee is enough
      # 1 - total_service_fee is less than 5 * autopegout_fee
      # 2 - total_service_fee is negative
      - alert: TotalServiceFeeWarning
        expr: alert_total_service_fee == 1
        labels:
          severity: warning
        annotations:
          description: "total service fee is less than 1000 satoshi"

      - alert: TotalServiceFeeCritical
        expr: alert_total_service_fee == 2
        labels:
          severity: critical
        annotations:
          description: "total service fee is negative"
